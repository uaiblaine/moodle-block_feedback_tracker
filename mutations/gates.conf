D3_show_more_reveals_everything | amd/src/views/DashboardView.js | d3_show_more_reveals_everything.pl
#   -> test_the_slice_starts_and_grows_by_a_bounded_step

# The course report: only the latest answer of each request kind reaches the screen (client audit, B3 and B6).
P1_page_answer_unguarded | amd/src/views/PendingReportView.js | p1_page_answer_unguarded.pl
