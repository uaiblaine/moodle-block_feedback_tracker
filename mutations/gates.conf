# Mutation spec of block_feedback_tracker: each guard and the test that must redden without
# it. Run from the main session (fleet rule 6), on both database families:
#   mdl mutate moodle-block_feedback_tracker moodle-block_feedback_tracker/mutations/gates.conf --fast --branch MOODLE_503_STABLE --php 8.4 --db pgsql
#   mdl mutate moodle-block_feedback_tracker moodle-block_feedback_tracker/mutations/gates.conf --fast --branch MOODLE_503_STABLE --php 8.4 --db mariadb
#
# tag | file | perl script

# .gitattributes: what the release package carries.
R1_licence_left_out | .gitattributes | r1_licence_left_out.pl
#   -> test_the_package_carries_a_licence_file

R2_pt_br_shipped | .gitattributes | r2_pt_br_shipped.pl
#   -> test_only_english_strings_ship

# README.md: every table is named for administrators.
R3_readme_drops_a_table | README.md | r3_readme_drops_a_table.pl
#   -> test_the_readme_names_tables_capabilities_and_dependencies

# settings.php: settings are stored in config_plugins.
R4_setting_in_main_config | settings.php | r4_setting_in_main_config.pl
#   -> test_settings_are_stored_per_plugin

# The stylesheet scope: no rule reaches the rest of the site, and every surface carries the scope.
S1_selector_unscoped | styles.css | s1_selector_unscoped.pl
#   -> test_styles_are_namespaced

S2_block_without_scope | block_feedback_tracker.php | s2_block_without_scope.pl
#   -> test_the_block_element_carries_the_style_scope

S3_page_without_scope | pages/teacher_dashboard.php | s3_page_without_scope.pl
#   -> test_every_page_carries_the_style_scope

# Runtime globals: what the code names must be loaded on the requests that run it, which PHPUnit
# cannot see in its own process (runtime_symbols_test, grader_filters_without_locallib_test).
G1_assign_filter_constant | classes/local/grading/grader_filters.php | g1_assign_filter_constant.pl
#   -> test_saved_status_filter_is_read_without_assign_locallib
#   -> test_runtime_code_names_only_loaded_globals

G2_response_without_grade_constants | classes/local/sla/gradebook_response.php | g2_response_without_grade_constants.pl
#   -> test_runtime_code_names_only_loaded_globals

G3_browser_without_grade_constants | classes/local/sla/submission_browser.php | g3_browser_without_grade_constants.pl
#   -> test_runtime_code_names_only_loaded_globals

G4_reset_page_without_lib | pages/reset.php | g4_reset_page_without_lib.pl
#   -> test_runtime_code_names_only_loaded_globals

# The teacher dashboard's courses table: a bounded slice of the sorted list (client audit, finding A1).
D1_dashboard_renders_every_row | amd/src/views/DashboardView.js | d1_dashboard_renders_every_row.pl
