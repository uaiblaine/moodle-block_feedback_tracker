# MDL Shield pull request reviews. Read from the default branch only (main), so a
# pull request cannot change the rules that judge it. A key written here overrides the same
# setting on the MDL Shield website; a key left out keeps inheriting.
#
# Reviews run only when asked: comment `!mdlshield review` (new commits since the last
# review) or `!mdlshield review full` (the whole pull request) on the pull request.
#
# Manual-only is made with a NON-empty include list that no pull request can match. The
# documentation says a non-empty `include` makes it a requirement ("only matching pull
# requests auto-review") and a forced command bypasses the filters. An EMPTY list does not
# do it: measured 2026-10-06, every pull request in the fleet was reviewed on opening and
# again on every push with `include.branches: []`, the first run starting 2-3 seconds
# after the pull request opened. Nothing targets the branch named below.

fail_on:
  severity: high      # the check fails on an open finding at or above this level

on-error: open        # a failure on MDL Shield's side must not block a merge

moodle:
  # One version per repository, with no per-branch mapping: this plugin supports 4.5 through 5.2 on one branch, and the highest supported core is the one reviewed.
  # Quoted: an unquoted 5.2 is read as a number and rejects the file.
  versions: ["5.2"]

trusted_users: ["uaiblaine"]   # GitHub usernames whose !mdlshield commands count

include:
  branches: ["mdlshield-manual-only"]   # a branch no pull request targets: see the note above

exclude:              # exclude wins over include
  authors: ["dependabot[bot]", "renovate[bot]"]
  paths:              # leave the review scope: they are also dropped from the lines counted against the size limits
    - "docs/**"
    - "lang/**"
    - "amd/build/**"
    - "**/*.min.js"
    - "**/*.map"
    - "mutations/**"
    - "tests/fixtures/**"
    - "tests/behat/**/*.feature"
    - ".mdlshield/**"
    - ".gitattributes"
    - "README.md"
    - "CHANGELOG.md"
    - "CLAUDE.md"
